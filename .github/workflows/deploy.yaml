name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - deploy
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build_site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Debug environment
        run: |
          echo "Repository name: ${{ github.event.repository.name }}"
          echo "Base path will be: /${{ github.event.repository.name }}"
          echo "Current directory: $(pwd)"
          echo "Directory contents:"
          ls -la

      - name: build
        run: |
          echo "Starting build with base path: $BASE_PATH"
          pnpm run build || { echo "Build failed"; exit 1; }
          cp static/CNAME build/CNAME
          echo "Build complete, checking output directory:"
          ls -la build/
          echo "Contents of build directory:"
          find build -type f | sort

      - name: Check build directory
        run: |
          if [ ! -d "build" ]; then
            echo "Error: build directory does not exist!"
            exit 1
          fi
          if [ -z "$(ls -A build)" ]; then
            echo "Error: build directory is empty!"
            exit 1
          fi
          echo "Build directory exists and contains files:"
          ls -la build/

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: "build/"
          name: "github-pages"

  deploy:
    needs: build_site
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
